services:
  - type: web
    name: line-task-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TIMEZONE
        value: Asia/Bangkok
      - key: CRON_SECRET
        generateValue: true
